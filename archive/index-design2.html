<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daniel's Barbecue &amp; Restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN SYSTEM — DANIEL'S BARBECUE & RESTAURANT
   "MIDNIGHT NEON" / DARK GLASS + TOP NAV · DESIGN V3
   ============================================================ */
:root{
  --paper:#070B14; --paper2:#101827;
  --surface:rgba(16,24,39,.86); --surface2:#141E30;
  --white:#F8FAFF;
  --ink:#E9F0FF; --ink2:#B7C4DF;
  --mut:#8795B4; --mut2:#5F6D8C;
  --border:#273553; --border2:#1E2A44;
  --brand:#3DE6C8; --brand-d:#8BF6E4; --brand-l:rgba(61,230,200,.13);
  --accent:#8B6CFF; --accent-d:#B9A6FF; --accent-l:rgba(139,108,255,.14);
  --danger:#FF5C7A; --danger-l:rgba(255,92,122,.13);
  --ok:#42E38B; --ok-l:rgba(66,227,139,.13);
  --info:#56A8FF; --info-l:rgba(86,168,255,.13);
  --grad:#3DE6C8; --grad-warm:#8B6CFF;
  --black:#070B14;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --shadow-lg:0 24px 70px rgba(0,0,0,.6);
  --glow:0 0 22px rgba(61,230,200,.22);
  --r:16px;
  --font-d:'Space Grotesk',system-ui,sans-serif;
  --font-b:'Inter',system-ui,-apple-system,sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font-b)}
body{
  background:radial-gradient(ellipse at 12% -10%,rgba(61,230,200,.10),transparent 45%),
             radial-gradient(ellipse at 88% 0%,rgba(139,108,255,.13),transparent 45%),
             #070B14;
  color:var(--ink);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
input:focus{outline:none}
::selection{background:rgba(61,230,200,.3);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2C3C5E;border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:#3DE6C8}
::-webkit-scrollbar-track{background:transparent}

/* ============ LOGIN ============ */
#login{
  position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  padding:24px;overflow:hidden;
  background:radial-gradient(circle at 20% 20%,rgba(61,230,200,.12),transparent 42%),
             radial-gradient(circle at 80% 80%,rgba(139,108,255,.16),transparent 45%),#070B14;
}
.login-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bg-bar{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--brand),var(--accent),var(--brand));box-shadow:0 0 24px rgba(61,230,200,.5)}
.bg-square{position:absolute;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(61,230,200,.14),transparent 70%);top:-180px;right:-130px;filter:blur(10px)}
.bg-ring{position:absolute;width:600px;height:600px;border:1px solid rgba(139,108,255,.16);border-radius:50%;bottom:-360px;left:-200px;box-shadow:0 0 0 70px rgba(139,108,255,.04),0 0 0 140px rgba(61,230,200,.03)}
.bg-dot{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--brand);top:24%;left:15%;box-shadow:0 0 22px 6px rgba(61,230,200,.4)}
.bg-stamp{position:absolute;top:50%;left:7%;margin-top:-100px;width:200px;height:200px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px dashed rgba(61,230,200,.18);color:rgba(61,230,200,.10);font-family:var(--font-d);font-size:82px;font-weight:700;transform:rotate(-12deg)}
.login-card{
  position:relative;z-index:1;width:430px;max-width:100%;padding:38px;border-radius:20px;
  background:linear-gradient(160deg,rgba(22,32,52,.96),rgba(9,14,25,.97));
  border:1px solid rgba(61,230,200,.3);
  box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 60px rgba(61,230,200,.09),inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(18px);
}
.login-card:before{content:"";position:absolute;left:22px;right:22px;top:0;height:2px;border-radius:0 0 6px 6px;background:linear-gradient(90deg,var(--brand),var(--accent));box-shadow:0 0 18px rgba(61,230,200,.6)}
.login-logo{width:62px;height:62px;border-radius:17px;background:linear-gradient(135deg,var(--brand),var(--accent));display:flex;align-items:center;justify-content:center;margin:0 auto 17px;box-shadow:0 0 34px rgba(61,230,200,.35)}
.login-logo svg{width:32px;height:32px}
.login-card h1{text-align:center;font-family:var(--font-d);font-size:26px;line-height:1.15;letter-spacing:-.02em;color:#fff}
.login-card .sub{text-align:center;font-family:var(--font-m);color:var(--brand);font-size:10px;letter-spacing:.18em;margin:11px 0 26px;font-weight:500}
.login-err{display:none;background:var(--danger-l);border:1px solid rgba(255,92,122,.35);color:#FF9CB0;font-size:12px;padding:11px 14px;margin-bottom:16px;border-radius:10px;font-weight:600}
.field{margin-bottom:15px}
.field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--mut);margin-bottom:7px;text-transform:uppercase}
.field input,.field select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:11px;background:rgba(7,11,20,.6);color:var(--ink);transition:.16s;font-weight:600}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand);background:rgba(7,11,20,.9);box-shadow:0 0 0 4px rgba(61,230,200,.1),0 0 20px rgba(61,230,200,.12)}
.field input::placeholder{color:var(--mut2)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;cursor:pointer;
  padding:12px 18px;border-radius:11px;background:linear-gradient(135deg,var(--brand),#2FC8E8);
  color:#04131B;box-shadow:0 8px 24px rgba(61,230,200,.28);font-weight:800;font-size:13px;letter-spacing:.02em;text-transform:uppercase;transition:.16s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(61,230,200,.4)}
.btn:active{transform:translateY(1px)}
.btn-sm{width:auto;padding:9px 16px;font-size:11.5px}
.btn-xs{width:auto;padding:6px 12px;font-size:10.5px}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--border);box-shadow:none}
.btn-ghost:hover{background:rgba(61,230,200,.1);border-color:rgba(61,230,200,.4);box-shadow:var(--glow)}
.btn-danger{background:linear-gradient(135deg,#FF5C7A,#E03456);color:#fff;box-shadow:0 8px 22px rgba(255,92,122,.25)}

/* ============ APP — TOP NAV LAYOUT ============ */
#app{display:none;height:100vh;overflow:hidden}
.sidebar{
  position:sticky;top:0;width:100%;height:70px;z-index:50;
  flex-direction:row;align-items:center;gap:16px;padding:0 22px;
  background:rgba(8,13,24,.88);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.side-logo{padding:0;border:none;width:auto;flex:none;gap:10px}
.side-logo .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--accent));display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 0 20px rgba(61,230,200,.3)}
.side-logo .mark svg{width:21px;height:21px}
.side-logo .text b{font-family:var(--font-d);font-size:14px;color:#fff;white-space:nowrap;letter-spacing:-.01em}
.side-logo .text small{font-size:8px;font-family:var(--font-m);color:var(--brand);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.side-nav{flex:1;min-width:0;display:flex;align-items:center;padding:0;overflow-x:auto;overflow-y:hidden}
.side-nav-label{display:none}
#nav{display:flex;gap:6px;align-items:center}
.ni{
  display:flex;align-items:center;gap:8px;width:auto;white-space:nowrap;
  padding:9px 13px;border-radius:999px;font-weight:600;color:var(--mut);font-size:12px;
  border:1px solid transparent;background:rgba(255,255,255,.035);margin:0;transition:.16s;cursor:pointer;
}
.ni:hover{background:rgba(255,255,255,.08);color:#fff}
.ni.active{background:linear-gradient(135deg,rgba(61,230,200,.2),rgba(139,108,255,.2));color:var(--brand-d);border-color:rgba(61,230,200,.45);box-shadow:0 0 20px rgba(61,230,200,.18)}
.ni svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ni .badge{margin-left:auto;background:rgba(255,92,122,.2);color:#FF9CB0;font-family:var(--font-m);font-size:9px;padding:1px 6px;border-radius:20px;min-width:18px;text-align:center}
.side-user{border:none;padding:0;margin-left:auto;gap:9px;flex:none}
.side-user .av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--accent));color:#04131B;font-family:var(--font-d);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.side-user .meta{display:none}
.side-user .out{color:var(--mut);font-family:var(--font-m);font-size:9px;font-weight:500;letter-spacing:.06em;padding:7px 9px;border-radius:8px;border:1px solid var(--border);transition:.16s}
.side-user .out:hover{background:var(--danger-l);border-color:rgba(255,92,122,.4);color:#FF9CB0}

.main{margin-left:0;height:calc(100vh - 70px)}
.topbar{background:transparent;border:none;padding:18px 26px 8px;display:flex;align-items:center;gap:16px;position:static}
.topbar .bread{font-family:var(--font-m);font-size:9px;letter-spacing:.14em;color:var(--brand);text-transform:uppercase;background:var(--brand-l);padding:4px 9px;border-radius:6px;display:inline-block;margin-bottom:4px}
.topbar h2{font-family:var(--font-d);font-size:27px;letter-spacing:-.035em;color:#fff}
.topbar h2:after{content:"";display:block;width:46px;height:3px;border-radius:4px;margin-top:6px;background:linear-gradient(90deg,var(--brand),var(--accent));box-shadow:0 0 12px rgba(61,230,200,.5)}
.topbar .spacer{flex:1}
.topbar .clock{text-align:right;font-family:var(--font-m);font-size:13px;font-weight:500;border:1px solid var(--border);background:rgba(16,24,39,.7);padding:7px 12px;border-radius:10px}
.topbar .clock em{font-style:normal;display:block;font-size:9px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.content{
  flex:1;overflow-y:auto;padding:18px 26px 38px;
  background-image:linear-gradient(rgba(61,230,200,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(61,230,200,.035) 1px,transparent 1px);
  background-size:34px 34px;
}

/* ============ KPI CARDS ============ */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
@media(max-width:1200px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.kpi-row{grid-template-columns:1fr}}
.kpi{
  position:relative;overflow:hidden;
  background:linear-gradient(160deg,rgba(20,30,48,.92),rgba(10,16,28,.94));
  border:1px solid var(--border);border-radius:var(--r);padding:18px;
  display:flex;align-items:center;gap:15px;box-shadow:var(--shadow);transition:.16s;
}
.kpi:before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:linear-gradient(90deg,var(--brand),var(--accent))}
.kpi:hover{transform:translateY(-3px);border-color:rgba(61,230,200,.4);box-shadow:0 14px 34px rgba(0,0,0,.5),var(--glow)}
.kpi .icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--brand-l);border:1px solid rgba(61,230,200,.25);box-shadow:var(--glow)}
.kpi .icon svg{width:21px;height:21px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kpi b{font-family:var(--font-d);font-size:21px;letter-spacing:-.02em;color:#fff}
.kpi small{font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1050px){.grid-2{grid-template-columns:1fr}}
.card{
  background:linear-gradient(160deg,rgba(19,28,46,.9),rgba(10,16,28,.92));
  border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);
  padding:20px 22px;backdrop-filter:blur(12px);
}
.card h3{font-family:var(--font-d);font-size:14px;letter-spacing:-.01em;margin-bottom:14px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border2);padding-bottom:13px;color:#fff}
.card h3 .grow{flex:1}
.card-empty{text-align:center;color:var(--mut);padding:30px 0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}

/* ============ WELCOME ============ */
.welcome{
  margin-bottom:20px;padding:22px 26px;border-radius:var(--r);position:relative;overflow:hidden;
  background:linear-gradient(110deg,rgba(17,52,60,.85),rgba(28,24,66,.85) 60%,rgba(12,20,36,.9));
  border:1px solid rgba(61,230,200,.22);box-shadow:var(--shadow),0 0 40px rgba(61,230,200,.07);
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.welcome:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;border:1px solid rgba(61,230,200,.14);right:-70px;top:-110px;box-shadow:0 0 0 45px rgba(139,108,255,.04)}
.welcome h2{font-family:var(--font-d);font-size:25px;letter-spacing:-.03em;color:#fff}
.welcome small{font-size:10.5px;color:var(--brand-d);font-weight:600;background:rgba(61,230,200,.1);border:1px solid rgba(61,230,200,.25);padding:7px 12px;border-radius:8px}

/* ============ LOW STOCK / RECENT ============ */
.ls-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--border2)}
.ls-row:last-child{border-bottom:none}
.ls-row .bar{flex:1;height:7px;background:rgba(255,255,255,.07);border-radius:20px;overflow:hidden}
.ls-row .bar i{display:block;height:100%;border-radius:20px}
.ls-row b{font-weight:700;font-size:12.5px;min-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.recent-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--border2)}
.recent-row:last-child{border-bottom:none}
.recent-row b{font-family:var(--font-m);font-size:10.5px;font-weight:500}
.recent-row .d{font-size:10px;color:var(--mut);font-family:var(--font-m)}
.recent-row .tot{margin-left:auto;font-weight:700;font-family:var(--font-m);font-size:12px;color:#fff}

/* ============ PILL ============ */
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-m);font-size:8.5px;font-weight:500;padding:4px 9px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.ok{background:var(--ok-l);color:var(--ok);border:1px solid rgba(66,227,139,.25)}
.pill.warn{background:var(--accent-l);color:var(--accent-d);border:1px solid rgba(139,108,255,.25)}
.pill.bad{background:var(--danger-l);color:#FF8CA3;border:1px solid rgba(255,92,122,.25)}
.pill.info{background:var(--info-l);color:#8CC6FF;border:1px solid rgba(86,168,255,.25)}
.pill.mut{background:rgba(255,255,255,.06);color:var(--ink2);border:1px solid var(--border)}
.pill.brand{background:var(--brand-l);color:var(--brand-d);border:1px solid rgba(61,230,200,.25)}

/* ============ POS ============ */
.pos-wrap{display:grid;grid-template-columns:1fr 360px;gap:16px;height:calc(100vh - 176px)}
@media(max-width:1100px){.pos-wrap{grid-template-columns:1fr;height:auto}}
.pos-left{display:flex;flex-direction:column;gap:14px;min-height:0}
.pos-search{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-wrap{flex:1;min-width:180px;position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.search-wrap input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--border);border-radius:11px;background:rgba(16,24,39,.8);color:var(--ink);font-weight:600;box-shadow:var(--shadow);transition:.16s}
.search-wrap input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(61,230,200,.1),var(--glow)}
.cat-row{display:flex;gap:8px;flex-wrap:wrap}
.cat-pill{padding:8px 14px;font-size:10.5px;font-weight:700;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:20px;color:var(--ink2);cursor:pointer;transition:.16s;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.cat-pill:hover{border-color:var(--brand);color:var(--brand-d);box-shadow:var(--glow)}
.cat-pill.active{background:linear-gradient(135deg,rgba(61,230,200,.22),rgba(139,108,255,.22));border-color:rgba(61,230,200,.5);color:#fff;box-shadow:0 0 20px rgba(61,230,200,.2)}
.cat-pill .cnt{font-family:var(--font-m);font-size:9px;opacity:.7;margin-left:3px}
.plist{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;align-content:start;padding:2px}
.pcard{
  background:linear-gradient(160deg,rgba(22,32,52,.92),rgba(10,16,28,.94));
  border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:.16s;overflow:hidden;position:relative;box-shadow:var(--shadow);
}
.pcard:hover{transform:translateY(-3px);border-color:rgba(61,230,200,.5);box-shadow:0 14px 32px rgba(0,0,0,.5),0 0 24px rgba(61,230,200,.14)}
.pcard:active{transform:translateY(-1px)}
.pcard.out{opacity:.45;filter:grayscale(1);pointer-events:none}
.pcard .accent-bar{height:4px;width:100%;background:linear-gradient(90deg,var(--brand),var(--accent))!important;box-shadow:0 0 12px rgba(61,230,200,.4)}
.pcard .badge{position:absolute;top:12px;right:11px;font-family:var(--font-m);font-size:8.5px;font-weight:500;padding:3px 8px;border-radius:20px;z-index:1;letter-spacing:.06em}
.badge.low{background:var(--accent-l);color:var(--accent-d);border:1px solid rgba(139,108,255,.35)}
.badge.out{background:var(--danger);color:#fff;border:1px solid #E03456}
.pcard .body{padding:13px 14px 15px}
.pcard .pname{font-family:var(--font-d);font-size:12.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.pcard .pcat{font-family:var(--font-m);font-size:8.5px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.pcard .pprice{display:inline-block;margin-top:11px;font-family:var(--font-m);font-weight:500;font-size:12.5px;color:var(--brand-d);background:var(--brand-l);border:1px solid rgba(61,230,200,.25);padding:4px 9px;border-radius:7px}
.pcard .pstock{font-family:var(--font-m);font-size:8.5px;color:var(--mut);margin-top:9px}

/* ============ CART ============ */
.cart{
  background:linear-gradient(180deg,rgba(18,27,45,.95),rgba(9,14,25,.96));
  border:1px solid rgba(61,230,200,.24);border-radius:var(--r);box-shadow:var(--shadow),0 0 40px rgba(61,230,200,.06);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.cart-head{padding:12px 14px;background:linear-gradient(120deg,rgba(61,230,200,.14),rgba(139,108,255,.14));display:flex;align-items:center;gap:8px;border-bottom:1px solid rgba(61,230,200,.22)}
.cart-head h4{font-family:var(--font-d);font-size:13px;letter-spacing:.01em;color:#fff}
.cart-head .cnt{font-family:var(--font-m);font-size:9px;font-weight:500;color:var(--brand);letter-spacing:.04em}
.cart-head .clear{margin-left:auto;font-family:var(--font-m);font-size:9px;font-weight:500;color:#FF9CB0;padding:4px 8px;border:1px solid rgba(255,92,122,.35);border-radius:6px;transition:.16s}
.cart-head .clear:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.cart-body{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column}
.cart-empty{margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-size:10.5px;padding:16px;text-transform:uppercase;letter-spacing:.08em;border:1px dashed var(--border);border-radius:12px;width:100%}
.cart-empty b{display:block;margin-bottom:5px;color:var(--ink);font-size:12px}

<script>
/* ============================================================
   SALES & INVENTORY POS — Daniel's Barbecue &amp; Restaurant
   localStorage-backed, role-aware, single-file
   ============================================================ */
const DB_KEY='sipos_db_v2',SESSION_KEY='sipos_session_v1';
const CATS=['All','BBQ Platters','Burgers','Sides','Drinks','Desserts'];
const ROLE_LABEL={superadmin:'Superadmin',client:'Client',staff:'Staff'};
const CAN={ manageStock:r=>r==='superadmin'||r==='client', manageUsers:r=>r==='superadmin', viewReports:r=>r!=='staff' };
const CAT_COLORS={ 'BBQ Platters':'#B91C1C','Burgers':'#D97706','Sides':'#7C3AED','Drinks':'#0369A1','Desserts':'#DB2777' };
const ING_CATS=['All','Meat','Poultry','Seafood','Produce','Dairy','Dry Goods','Sauce & Marinade','Pantry'];
const ING_COLORS={'Meat':'#DC2626','Poultry':'#D97706','Seafood':'#0369A1','Produce':'#15803D','Dairy':'#2563EB','Dry Goods':'#7C3AED','Sauce & Marinade':'#CA8A04','Pantry':'#92400E'};
const dstr=off=>new Date(Date.now()+864e5*off).toISOString().slice(0,10);
function expStatus(exp){if(!exp)return null;const d=new Date(exp),t=new Date();if(exp<todayStr())return{st:'bad',lb:'EXPIRED'};const days=Math.floor((d-t)/864e5);if(days<=3)return{st:'warn',lb:'EXP SOON'};return null}
const qty=n=>Number.isInteger(n)?n:Number(Number(n||0).toFixed(2));
const RECIPES={
  'Pork BBQ Plate':[['Pork Liempo',0.2],['BBQ Marinade',0.05],['Cooking Oil',0.02],['Jasmine Rice',0.2]],
  'Chicken BBQ Plate':[['Chicken Thigh',0.25],['BBQ Marinade',0.05],['Soy Sauce',0.02],['Jasmine Rice',0.2]],
  'Beef BBQ Plate':[['Beef Sirloin',0.2],['BBQ Marinade',0.05],['Cooking Oil',0.02],['Jasmine Rice',0.2]],
  'Liempo BBQ Plate':[['Pork Belly',0.2],['BBQ Marinade',0.05],['Calamansi',0.02],['Jasmine Rice',0.2]],
  'Mixed Grill Platter':[['Pork Liempo',0.15],['Pork Belly',0.1],['Chicken Thigh',0.1],['Squid (Pusit)',0.05],['Jasmine Rice',0.2]],
  'Inihaw na Pusit':[['Squid (Pusit)',0.3],['Calamansi',0.03],['Soy Sauce',0.03],['Jasmine Rice',0.2]],
  'Baby Back Ribs':[['Pork Belly',0.35],['Honey',0.05],['BBQ Marinade',0.05],['Jasmine Rice',0.2]],
  'Sisig Plate':[['Pork Liempo',0.2],['Onion',0.05],['Calamansi',0.03],['Jasmine Rice',0.2]],
  'BBQ Burger':[['Pork Liempo',0.12],['Onion',0.03],['Tomato',0.03],['Cabbage',0.03],['Cheese',0.02]],
  'Classic Burger':[['Pork Liempo',0.12],['Onion',0.03],['Tomato',0.03],['Cabbage',0.03]],
  'Double BBQ Burger':[['Pork Liempo',0.2],['Onion',0.04],['Tomato',0.04],['Cabbage',0.04],['Cheese',0.03]],
  'Cheeseburger':[['Pork Liempo',0.12],['Cheese',0.03],['Onion',0.02],['Cabbage',0.02]],
  'Steamed Rice':[['Jasmine Rice',0.2]],
  'Garlic Rice':[['Jasmine Rice',0.2],['Garlic',0.02],['Cooking Oil',0.02]],
  'Corn on the Cob':[['Corn on Cob',1]],
  'Coleslaw':[['Cabbage',0.2],['Sugar',0.02]],
  'Grilled Vegetables':[['Corn on Cob',0.5],['Tomato',0.1],['Onion',0.1],['Cooking Oil',0.02]],
  'French Fries (Reg)':[['Potato',0.2],['Cooking Oil',0.05]],
  'Iced Tea':[['Sugar',0.03]],
  'Fresh Lemonade':[['Calamansi',0.1],['Sugar',0.05]],
  'Iced Coffee':[['Milk',0.1],['Sugar',0.03]],
  'Leche Flan':[['Milk',0.15],['Sugar',0.05],['Eggs (tray)',0.5]],
  'Halo-Halo':[['Milk',0.1],['Sugar',0.05],['Corn on Cob',0.5]],
  'Ice Cream Scoop':[['Milk',0.15],['Sugar',0.05]],
};

/* --- helpers --- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'PHP '+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>Number(n||0).toLocaleString('en-PH',{maximumFractionDigits:2});
const todayStr=()=>new Date().toISOString().slice(0,10);
const fmtDT=iso=>{const d=new Date(iso);return d.toLocaleString('en-PH',{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})};
const fmtD=iso=>{const d=new Date(iso);return d.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const refNo=()=>{const db=load();const n=db.meta.seq+1;db.meta.seq=n;save(db);return'QF-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+String(n).padStart(4,'0')};
let _toastTimer;
function toast(msg){const t=$('#toast'),tx=$('#toastTxt');tx.textContent=msg;t.classList.add('show');clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>t.classList.remove('show'),2500)}
const hideToast=()=>{const t=$('#toast');if(t)t.classList.remove('show');clearTimeout(_toastTimer)};

/* --- storage --- */
function defaultDB(){return{meta:{seq:0,seed:'daniels-4'},items:[],ingredients:[],transactions:[],customers:[],users:[
  {id:'u1',username:'user',password: '<redacted>',name:'User',role:'superadmin'},
  {id:'u2',username:'client',password: '<redacted>',name:'Bedia Gerro F.',role:'client'},
  {id:'u3',username:'staff',password: '<redacted>',name:'Mahinay Irish D.',role:'staff'},
]}}
function load(){try{const r=JSON.parse(localStorage.getItem(DB_KEY));if(r&&r.items)return migrate(r)}catch(e){}const db=defaultDB();seed(db);localStorage.setItem(DB_KEY,JSON.stringify(db));return db}
function save(db){localStorage.setItem(DB_KEY,JSON.stringify(db))}
function session(){try{return JSON.parse(localStorage.getItem(SESSION_KEY))}catch(e){return null}}
function cashierName(t,db){const u=t.cashierId&&db.users.find(x=>x.id===t.cashierId);return u?u.name:(t.cashier||'')}
function migrate(db){
  let changed=false;
  /* stale Quickbite-era menu? replace with the Daniel's BBQ seed */
  const NEWCATS=CATS.slice(1);
  const hasNewMenu=(db.items||[]).some(i=>NEWCATS.includes(i.category));
  if((db.items||[]).length&&!hasNewMenu){seed(db);db.users.forEach(u=>{if(u.id==='u2')u.name='Bedia Gerro F.';if(u.id==='u3')u.name='Mahinay Irish D.'});save(db);return db}
  /* older seed version? rebuild menu + ingredients to match latest PDF seed */
  if(!(db.meta&&db.meta.seed==='daniels-4')){db.items=seedItems();seedIngredients(db);db.meta=Object.assign(db.meta||{seq:0},{seed:'daniels-4'});changed=true}
  const SEEDC={'Maria Santos':'u3','Welbert Verano':'u2'};
  const SEEDU={'Maria Santos':'staff','Welbert Verano':'client'};
  (db.transactions||[]).forEach(t=>{
    if(!t.cashierId&&t.cashier){
      const u=db.users.find(x=>x.name===t.cashier)
        ||db.users.find(x=>SEEDC[t.cashier]&&x.id===SEEDC[t.cashier])
        ||db.users.find(x=>SEEDU[t.cashier]&&(x.username||'').toLowerCase()===SEEDU[t.cashier])
        ||null;
      if(u){t.cashierId=u.id;t.cashier=u.name;changed=true}
    }else if(t.cashierId){
      const u=db.users.find(x=>x.id===t.cashierId);
      if(u&&t.cashier!==u.name){t.cashier=u.name;changed=true}
    }
  });
  (db.customers||[]).forEach(c=>{
    const n={c1:'Bedia Gerro F.',c2:'Mahinay Irish D.'}[c.id];
    if(n&&c.name!==n){c.name=n;changed=true}
  });
  (db.items||[]).forEach(i=>{if(i.expiry===undefined){i.expiry='';changed=true}});
  if(!('ingredients' in db)){seedIngredients(db);changed=true}
  if(db.ingredients!==undefined){db.ingredients.forEach(g=>{if(g.expiry===undefined){g.expiry='';changed=true}})}
  if(changed)save(db);
  return db;
}

function addCart(id){const db=load(),it=db.items.find(i=>i.id===id);if(!it||it.stock<=0)return toast('Out of stock');const has=cart.find(c=>c.id===id);if(has){if(has.qty+1>it.stock)return toast('Only '+it.stock+' available');has.qty++}else cart.push({id,name:it.name,price:it.price,qty:1});renderCart()}
function setQty(id,d){const db=load(),c=cart.find(x=>x.id===id),it=db.items.find(i=>i.id===id);if(!c)return;c.qty+=d;if(c.qty<=0)cart=cart.filter(x=>x.id!==id);else if(it&&c.qty>it.stock){c.qty=it.stock;toast('Max stock: '+it.stock)}renderCart()}
function rmCart(id){cart=cart.filter(x=>x.id!==id);renderCart()}
function clearCart(){cart=[];cartDiscount=0;cartCustomer='';renderCart()}
function renderCart(){
  const body=$('#cartBody'),foot=$('#cartFoot');if(!body)return;

  if(!cart.length){body.innerHTML=`<div class="cart-empty"><b>Cart is empty</b>Tap a menu item to start</div>`}else{

function quickCash(amt){const i=$('#cashInput');if(i){i.value=amt.toFixed(2);updateChange();i.focus()}}
function updateChange(){const t=cartTotals(),paid=parseFloat($('#cashInput')?.value)||0,el=$('#changeTxt');if(el)el.textContent=paid>=t.total?`PHP ${money0(paid-t.total)}`:'—'}
function checkout(){
  if(!cart.length)return;const db=load(),t=cartTotals(),paid=parseFloat($('#cashInput')?.value)||0;
  const custSel=$('#custSel')?.value;let customer=null;
  if(custSel)customer=db.customers.find(c=>c.id===custSel);
  if(paid<t.total)return toast('Insufficient cash amount');
  for(const c of cart){
    const it=db.items.find(i=>i.id===c.id);
    for(const r of (it&&it.recipe)||[]){
      const g=db.ingredients.find(x=>x.name===r.name);
      if(g&&g.stock<r.qty*c.qty)return toast('Not enough '+r.name+' ('+qty(g.stock)+' '+g.unit+' left)');
    }
  }
  const trx={id:uid(),ref:refNo(),date:new Date().toISOString(),items:cart.map(c=>({name:c.name,qty:c.qty,price:c.price,line:0})),subtotal:t.sub,discount:t.disc,total:t.total,payment:paid,change:paid-t.total,cashier:me().name,cashierId:me().id,customer:customer?.name,customerId:customer?.id,orderType,status:'completed'};

    <div class="toolrow"><div class="search-wrap" style="flex:0 1 280px"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input placeholder="Search ref or customer..." value="${esc(salesQ)}" oninput="salesQ=this.value.toLowerCase();renderSales()"></div>
      ${[['all','All'],['today','Today'],['completed','Completed'],['cancelled','Cancelled']].map(([k,l])=>`<div class="cat-pill ${salesFilter===k?'active':''}" onclick="salesFilter='${k}';renderSales()">${l}</div>`).join('')}
      <div class="spacer"></div>${srvOps?'<button class="btn btn-ghost btn-sm" onclick="exportSalesCSV()">Export CSV</button>':''}
    </div>
    <div class="tbl-wrap"><table><tr><th>Ref</th><th>Date</th><th>Cashier</th><th>Customer</th><th>Order</th><th>Items</th><th>Total</th><th>Status</th><th style="text-align:right">Actions</th></tr>
      ${list.length?list.map(t=>`<tr><td><b>${t.ref}</b></td><td class="num">${fmtDT(t.date)}</td><td>${esc(cashierName(t,db))}</td><td>${esc(t.customer||'Walk-in')}</td><td><span class="pill info">${esc(t.orderType||'Dine-in')}</span></td><td class="num">${t.items.reduce((s,i)=>s+i.qty,0)}</td><td class="num"><b>PHP ${money0(t.total)}</b></td><td><span class="pill ${t.status==='completed'?'ok':'bad'}">${t.status.toUpperCase()}</span></td><td><div class="act"><button class="icon-btn view" onclick="viewSale('${t.id}')"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>${srvOps&&t.status==='completed'?`<button class="icon-btn del" onclick="voidSale('${t.id}')" title="Void"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`:''}</div></td></tr>`).join(''):`<tr><td colspan="9" class="card-empty">No orders found</td></tr>`}
    </table></div>`;
}
function viewSale(id){const db=load(),t=db.transactions.find(x=>x.id===id);if(t)showReceiptModal(t)}
function voidSale(id){const db=load(),t=db.transactions.find(x=>x.id===id);openModal(`<h3>Void this order?</h3><div class="msub">${t.ref} &middot; PHP ${money0(t.total)} by ${esc(cashierName(t,db))}. Food is already prepared — menu and ingredient stocks are NOT returned; only this sale is removed from totals.</div><div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">Keep</button><button class="btn btn-danger" onclick="confirmVoid('${id}')">Void Order</button></div>`)}
function confirmVoid(id){const db=load(),t=db.transactions.find(x=>x.id===id);t.status='cancelled';save(db);closeModal();renderSales();toast('Order voided — no stock returned')}
function exportSalesCSV(){const db=load();const rows=[['Ref','Date','Cashier','Customer','OrderType','Items','Total','Status']];db.transactions.forEach(t=>rows.push([t.ref,t.date,cashierName(t,db),t.customer||'Walk-in',t.orderType||'Dine-in',t.items.reduce((s,i)=>s+i.qty,0),t.total,t.status]));const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='sales-'+todayStr()+'.csv';a.click();toast('CSV exported')}

/* ============================================================
   CUSTOMERS
   ============================================================ */
let custQ='';
function renderCustomers(){
  const db=load(),can=CAN.manageStock(me().role);const list=db.customers.filter(c=>!custQ||c.name.toLowerCase().includes(custQ)||c.phone?.includes(custQ));
  $('#content').innerHTML=`
    <div class="toolrow"><div class="search-wrap" style="flex:0 1 280px"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input placeholder="Search customers..." value="${esc(custQ)}" oninput="custQ=this.value.toLowerCase();renderCustomers()"></div>
      <div class="spacer"></div>${can?'<button class="btn btn-sm" onclick="custForm()">+ Add Customer</button>':''}</div>
    <div class="tbl-wrap"><table><tr><th>Customer</th><th>Phone</th><th>Email</th><th>Address</th><th>Spend</th><th>Orders</th><th>Tier</th>${can?'<th style="text-align:right">Actions</th>':''}</tr>
      ${list.length?list.map(c=>{const txs=db.transactions.filter(t=>t.customerId===c.id&&t.status==='completed');const spent=txs.reduce((s,t)=>s+t.total,0);const n=txs.length;const tier=spent>=10000?'PRESTIGE':spent>0?'REGULAR':'NEW';const tp=tier==='PRESTIGE'?'info':tier==='REGULAR'?'ok':'mut';
        return`<tr><td><b>${esc(c.name)}</b></td><td class="num">${esc(c.phone||'—')}</td><td>${esc(c.email||'—')}</td><td>${esc(c.address||'—')}</td><td class="num"><b>PHP ${money0(spent)}</b></td><td class="num">${n}</td><td><span class="pill ${tp}">${tier}</span></td>${can?`<td><div class="act"><button class="icon-btn view" onclick="custHistory('${c.id}')"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z M8 8h8M8 12h8M8 16h5"/></svg></button><button class="icon-btn edit" onclick="custForm('${c.id}')"><svg viewBox="0 0 24 24"><path d="M11 4H4v16h16v-7 M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button><button class="icon-btn del" onclick="delCust('${c.id}')"><svg viewBox="0 0 24 24"><path d="M3 6h18 M8 6V4h8v2 M6 6l1 14h10l1-14"/></svg></button></div></td>`:'<td></td>'}</tr>`}).join(''):`<tr><td colspan="8" class="card-empty">No customers found</td></tr>`}
    </table></div>`;
}
function custForm(id){const db=load(),c=id?db.customers.find(x=>x.id===id):null;
  openModal(`<h3>${c?'Edit':'Add'} Customer</h3><div class="msub">${c?'Update details':'New customers start as NEW tier.'}</div>
    <div class="field"><label>Name *</label><input id="c_name" value="${esc(c?.name||'')}"></div>
    <div class="row2"><div class="field"><label>Phone</label><input id="c_phone" value="${esc(c?.phone||'')}"></div><div class="field"><label>Email</label><input id="c_email" value="${esc(c?.email||'')}"></div></div>
    <div class="field"><label>Address</label><input id="c_addr" value="${esc(c?.address||'')}"></div>
    <div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveCust('${c?c.id:''}')">${c?'Save':'Add'}</button></div>`);
}
function saveCust(id){const name=$('#c_name').value.trim();if(!name)return toast('Name required');const db=load();if(id){const c=db.customers.find(x=>x.id===id);Object.assign(c,{name,phone:$('#c_phone').value.trim(),email:$('#c_email').value.trim(),address:$('#c_addr').value.trim()});toast('Updated')}else{db.customers.push({id:uid(),name,phone:$('#c_phone').value.trim(),email:$('#c_email').value.trim(),address:$('#c_addr').value.trim(),created:new Date().toISOString()});toast('Customer added')}save(db);closeModal();renderCustomers()}
function custHistory(id){const db=load(),c=db.customers.find(x=>x.id===id),txs=db.transactions.filter(t=>t.customerId===id).sort((a,b)=>new Date(b.date)-new Date(a.date)),spent=txs.filter(t=>t.status==='completed').reduce((s,t)=>s+t.total,0);
  openModal(`<h3>${esc(c.name)}</h3><div class="msub">Total: PHP ${money0(spent)} &middot; ${txs.length} transactions</div><div style="max-height:42vh;overflow-y:auto">${txs.length?txs.map(t=>`<div class="ls-row"><div><b>${t.ref}</b><div class="d" style="font-size:10.5px;color:var(--mut2)">${fmtDT(t.date)}</div></div><span class="pill ${t.status==='completed'?'ok':'bad'}">${t.status.toUpperCase()}</span><div class="stk"><b>PHP ${money0(t.total)}</b></div></div>`).join(''):'<div class="card-empty">No purchases</div>'}</div><div class="mfoot"><button class="btn" onclick="closeModal()">Close</button></div>`)}
function delCust(id){const db=load(),c=db.customers.find(x=>x.id===id);openModal(`<h3>Delete Customer?</h3><div class="msub">"${esc(c.name)}" — past transactions are preserved.</div><div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="confirmDelCust('${id}')">Delete</button></div>`)}
function confirmDelCust(id){const db=load();db.customers=db.customers.filter(c=>c.id!==id);save(db);closeModal();renderCustomers();toast('Customer deleted')}

/* ============================================================
   REPORTS
   ============================================================ */
function renderReports(){
  const db=load(),done=db.transactions.filter(t=>t.status==='completed');
  const byItem={};done.forEach(t=>t.items.forEach(i=>{byItem[i.name]=byItem[i.name]||{qty:0,sales:0};byItem[i.name].qty+=i.qty;byItem[i.name].sales+=i.qty*i.price}));
  const best=Object.entries(byItem).sort((a,b)=>b[1].qty-a[1].qty).slice(0,8);
  const topCat=[...new Set(db.items.map(i=>i.category))].map(cat=>{const items=db.items.filter(i=>i.category===cat);return{cat,count:items.length,stock:items.reduce((s,i)=>s+i.stock,0),value:items.reduce((s,i)=>s+i.stock*i.price,0)}}).sort((a,b)=>b.value-a.value);
  const days=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*86400000),key=d.toISOString().slice(0,10);days.push({key,label:d.toLocaleDateString('en-PH',{weekday:'short'}),sum:done.filter(t=>t.date.slice(0,10)===key).reduce((s,t)=>s+t.total,0)})}
  const maxDay=Math.max(1,...days.map(d=>d.sum));
  const grand=done.reduce((s,t)=>s+t.total,0);
  const invValue=db.items.reduce((s,i)=>s+i.stock*i.price,0);
  $('#content').innerHTML=`
    <div class="kpi-row">
      <div class="kpi"><div class="icon" style="background:var(--grad)"><svg viewBox="0 0 24 24"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><div><b>PHP ${money0(grand)}</b><br><small>Total Sales</small></div></div>
      <div class="kpi"><div class="icon" style="background:linear-gradient(135deg,#0EA5E9,#0284C7)"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z M8 8h8M8 12h8M8 16h5"/></svg></div><div><b>${done.length}</b><br><small>Completed Orders</small></div></div>
      <div class="kpi"><div class="icon" style="background:var(--grad-warm)"><svg viewBox="0 0 24 24"><path d="M4 6h16v14H4z M4 6l2-3h12l2 3"/></svg></div><div><b>${db.items.reduce((s,i)=>s+i.stock,0)}</b><br><small>Units in Stock</small></div></div>
      <div class="kpi"><div class="icon" style="background:linear-gradient(135deg,#7C3AED,#6D28D9)"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/></svg></div><div><b>PHP ${money0(invValue)}</b><br><small>Inventory Value</small></div></div>
    </div>
    <div class="grid-2">
      <div class="card"><h3>7-Day Sales</h3><div class="chart">${days.map(d=>`<div class="bar"><em>PHP ${money0(d.sum)}</em><i style="height:${Math.max(3,(d.sum/maxDay)*100)}%"></i><span>${d.label}</span></div>`).join('')}</div></div>
      <div class="card"><h3>Best Sellers</h3>${best.length?best.map(([n,v],idx)=>`<div class="ls-row"><span class="pill mut" style="min-width:22px;justify-content:center">${idx+1}</span><b style="min-width:0;flex:1">${esc(n)}</b><div class="stk">${v.qty} sold</div><div class="stk"><b>PHP ${money0(v.sales)}</b></div></div>`).join(''):'<div class="card-empty">No data yet</div>'}</div>
    </div>
    <div class="card" style="margin-top:16px"><h3>Menu by Category</h3><table><tr><th>Category</th><th>Items</th><th>Units</th><th>Value</th><th>Share</th></tr>
      ${topCat.map(c=>`<tr><td><b>${c.cat}</b></td><td class="num">${c.count}</td><td class="num">${c.stock}</td><td class="num"><b>PHP ${money0(c.value)}</b></td><td style="width:120px"><div class="ls-row" style="border:none;padding:0"><div class="bar" style="flex:1"><i style="width:${db.items.length?(c.count/db.items.length*100):0}%;background:var(--grad)"></i></div></div></td></tr>`).join('')}
    </table></div>`;
}

/* ============================================================
   USERS
   ============================================================ */
function renderUsers(){
  const db=load(),meU=session();
  $('#content').innerHTML=`
    <div class="toolrow"><span class="pill info">Superadmin only</span><div class="spacer"></div><button class="btn btn-sm" onclick="userForm()">+ Add User</button></div>
    <div class="tbl-wrap"><table><tr><th>User</th><th>Username</th><th>Role</th><th>Access</th><th style="text-align:right">Actions</th></tr>
      ${db.users.map(u=>{const access=u.role==='superadmin'?'Full access':u.role==='client'?'Sales, Inventory, Customers, Reports':'POS, Inventory view';
        return`<tr><td><b>${esc(u.name)}</b> ${u.id===meU?.id?'<span class="pill info">YOU</span>':''}</td><td class="num">${esc(u.username)}</td><td><span class="pill ${u.role==='superadmin'?'mut':u.role==='client'?'info':'warn'}">${ROLE_LABEL[u.role]}</span></td><td style="color:var(--mut)">${access}</td><td><div class="act"><button class="icon-btn edit" onclick="userForm('${u.id}')"><svg viewBox="0 0 24 24"><path d="M11 4H4v16h16v-7 M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>${u.id!==meU?.id?`<button class="icon-btn del" onclick="delUser('${u.id}')"><svg viewBox="0 0 24 24"><path d="M3 6h18 M8 6V4h8v2 M6 6l1 14h10l1-14"/></svg></button>`:''}</div></td></tr>`}).join('')}
    </table></div>`;
}
function userForm(id){const db=load(),u=id?db.users.find(x=>x.id===id):null;
  openModal(`<h3>${u?'Edit':'Add'} User</h3><div class="msub">${u?'Update account':'Create client or staff account'}</div>
    <div class="field"><label>Name *</label><input id="u_name" value="${esc(u?.name||'')}"></div>
    <div class="row2"><div class="field"><label>Username *</label><input id="u_user" value="${esc(u?.username||'')}"></div><div class="field"><label>Password ${u?'(blank to keep)':'*'}</label><input id="u_pass" type="text"></div></div>
    <div class="field"><label>Role</label><select id="u_role" style="width:100%;padding:11px;border:1.5px solid var(--border);border-radius:11px;background:var(--surface);font-weight:700"><option value="superadmin" ${u?.role==='superadmin'?'selected':''}>Superadmin</option><option value="client" ${u?.role==='client'?'selected':''}>Client</option><option value="staff" ${u?.role==='staff'?'selected':''}>Staff</option></select></div>
    <div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveUser('${u?u.id:''}')">${u?'Save':'Add'}</button></div>`);
}
function saveUser(id){const name=$('#u_name').value.trim(),usr=$('#u_user').value.trim(),pass=$('#u_pass').value,role=$('#u_role').value;if(!name||!usr)return toast('Name and username required');const db=load();
  if(id){const u=db.users.find(x=>x.id===id);if(db.users.some(x=>x.username.toLowerCase()===usr.toLowerCase()&&x.id!==id))return toast('Username taken');u.name=name;u.username=usr;u.role=role;if(pass)u.password=pass;
    if(u.id===session()?.id){const s=session();s.role=role;s.name=name;localStorage.setItem(SESSION_KEY,JSON.stringify(s))}toast('User updated')}
  else{if(!pass)return toast('Password required');if(db.users.some(x=>x.username.toLowerCase()===usr.toLowerCase()))return toast('Username taken');db.users.push({id:uid(),username:usr,password:pass,name,role});toast('User added')}
  save(db);closeModal();renderUsers()}
function delUser(id){const db=load(),u=db.users.find(x=>x.id===id);if(u.role==='superadmin'&&db.users.filter(x=>x.role==='superadmin').length<=1)return toast("Can't delete only superadmin");
  openModal(`<h3>Delete User?</h3><div class="msub">"${esc(u.name)}" will lose access.</div><div class="mfoot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="confirmDelUser('${id}')">Delete</button></div>`)}
function confirmDelUser(id){const db=load();db.users=db.users.filter(u=>u.id!==id);save(db);closeModal();renderUsers();toast('User deleted')}

/* ============================================================
   MODAL
   ============================================================ */
function openModal(html,wide){$('#modalBox').className='modal'+(wide?' wide':'');$('#modalBox').innerHTML=html;$('#overlay').classList.add('show')}
function closeModal(){$('#overlay').classList.remove('show')}
document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeModal()}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ============================================================
   INIT
   ============================================================ */
function boot(){load();const s=session();if(s){const db=load();if(db.users.find(u=>u.id===s.id)){$('#login').style.display='none';$('#app').style.display='block';$('#userName').textContent=s.name;$('#userRole').textContent=ROLE_LABEL[s.role];$('#userAvatar').textContent=(s.name||'?').trim().charAt(0).toUpperCase();go('dashboard');return}localStorage.removeItem(SESSION_KEY)}$('#login').style.display='flex';$('#logUser').focus()}
setInterval(()=>{const el=$('#clock');if(el){const d=new Date();el.innerHTML=d.toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'})+'<em>'+d.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})+'</em>'}},1000);
boot();
</script>
</body>
</html>
